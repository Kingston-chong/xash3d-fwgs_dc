name: Build Xash3D Dreamcast

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # Allows you to manually trigger the build online

jobs:
  build-dc:
    runs-on: ubuntu-latest
    container:
      image: kazade/dreamcast-sdk:latest # Contains the KOS toolchain required for Dreamcast compilation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile Engine and SDK
        run: |
          # The repository documentation specifies cloning companion repos if missing, 
          # or running the Makefile configuration directly.
          make all

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-dreamcast-build
          path: |
            build/
            *.BIN
